name: Deploy migrations to production

# Apply Supabase migrations to the production database whenever migrations
# change on main. Manual runs are allowed via the Actions tab
# (workflow_dispatch); a run with nothing pending is a no-op.
#
# Production is the owner's shared Supabase project (one schema per app). Its
# Supabase CLI migration history belongs to the project hub, so this must never
# run `supabase link` or `supabase db push`. scripts/db-push.mjs keeps
# Brainwash's own history in brainwash.schema_migrations instead.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/db-push.mjs"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

# Avoid two deploys racing on the same database.
concurrency:
  group: supabase-prod-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply pending migrations
        run: node scripts/db-push.mjs --apply
